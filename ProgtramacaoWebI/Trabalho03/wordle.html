<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Wordle</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .wordle-row { display: flex; gap: 5px; margin-bottom: 5px; justify-content: center; }
        .wordle-box {
            width: 40px; height: 40px; display: flex; align-items: center;
            justify-content: center; border: 2px solid #ccc; font-weight: bold;
            font-size: 20px; text-transform: uppercase;
        }
        .correct-pos { background-color: green; color: white; border-color: green; }
        .wrong-pos { background-color: yellow; color: black; border-color: yellow; }
        .wrong-letter { background-color: #787c7e; color: white; border-color: #787c7e; }
        #boardWordle { margin-top: 20px; display: flex; flex-direction: column; align-items: center; }
        .controles-wordle { text-align: center; }
    </style>
</head>
<body>
    <div class="container">
        <a href="index.html">← Voltar ao Menu</a>
        <h2>Exercício: Jogo Wordle</h2>
        <p>Tente adivinhar a palavra secreta de 5 letras!</p>
        
        <div class="controles-wordle">
            <input type="text" id="inputWordle" maxlength="5" placeholder="Sua tentativa..." style="width: auto;">
            <button id="btnSubmeter">Submeter</button>
            <button id="btnReiniciar">Reiniciar Jogo</button>
        </div>
        
        <h3 id="msgVitoria" style="color: green; text-align: center;"></h3>
        <div id="boardWordle"></div>
    </div>

    <script src="js/wordle.js"></script>
</body>
</html>
